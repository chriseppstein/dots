<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Dots 3D mark: a mini lattice cube in the game's player colors -->
  <rect width="64" height="64" rx="14" fill="#0e1116"/>
  <!-- top face hint (claimed-face gold) -->
  <polygon points="19,25 43,25 53,15 29,15" fill="#fbbf24" opacity="0.28"/>
  <!-- back/depth edges (undrawn grey) -->
  <g stroke="#3c4859" stroke-width="2.6" stroke-linecap="round">
    <line x1="53" y1="15" x2="53" y2="39"/>
    <line x1="29" y1="15" x2="29" y2="39"/>
    <line x1="29" y1="39" x2="53" y2="39"/>
    <line x1="19" y1="49" x2="29" y2="39"/>
    <line x1="43" y1="49" x2="53" y2="39"/>
  </g>
  <!-- player 1 (blue) edges -->
  <g stroke="#3b82f6" stroke-width="4" stroke-linecap="round">
    <line x1="19" y1="25" x2="43" y2="25"/>
    <line x1="19" y1="25" x2="19" y2="49"/>
    <line x1="29" y1="15" x2="19" y2="25"/>
  </g>
  <!-- player 2 (orange) edges -->
  <g stroke="#f59e0b" stroke-width="4" stroke-linecap="round">
    <line x1="19" y1="49" x2="43" y2="49"/>
    <line x1="43" y1="25" x2="43" y2="49"/>
    <line x1="43" y1="25" x2="53" y2="15"/>
  </g>
  <!-- lattice dots -->
  <g fill="#e8edf4">
    <circle cx="19" cy="25" r="3.4"/>
    <circle cx="43" cy="25" r="3.4"/>
    <circle cx="19" cy="49" r="3.4"/>
    <circle cx="43" cy="49" r="3.4"/>
    <circle cx="29" cy="15" r="2.6"/>
    <circle cx="53" cy="15" r="2.6"/>
    <circle cx="53" cy="39" r="2.6"/>
    <circle cx="29" cy="39" r="2.6"/>
  </g>
</svg>
